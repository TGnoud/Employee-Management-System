<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .panel {
            width: min(440px, calc(100vw - 32px));
            padding: 24px;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 26px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #ffffff;
        }

        .button {
            width: 100%;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
        }

        .error {
            display: block;
            margin-top: 6px;
            color: #b91c1c;
            font-size: 13px;
        }

        .summary-error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
        }

        .link {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="panel">
    <h1>Dang ky</h1>

    <div class="summary-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>

    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" th:field="*{username}" autocomplete="username">
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="field">
            <label for="role">Role</label>
            <select id="role" th:field="*{role}">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        </div>

        <button class="button" type="submit">Dang ky</button>
    </form>

    <div class="link">
        Da co tai khoan? <a th:href="@{/auth/login}">Dang nhap</a>
    </div>
</main>
</body>
</html>
