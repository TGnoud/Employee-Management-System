<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .panel {
            width: min(420px, calc(100vw - 32px));
            padding: 24px;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 26px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .button {
            width: 100%;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
        }

        .message {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .link {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="panel">
    <h1>Dang nhap</h1>

    <div class="message success" th:if="${param.registered}">Dang ky thanh cong. Hay dang nhap.</div>
    <div class="message success" th:if="${param.logout}">Ban da dang xuat.</div>
    <div class="message error" th:if="${param.error}">Sai username hoac password.</div>

    <form th:action="@{/auth/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username">
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
        </div>

        <button class="button" type="submit">Dang nhap</button>
    </form>

    <div class="link">
        Chua co tai khoan? <a th:href="@{/auth/register}">Dang ky</a>
    </div>
</main>
</body>
</html>
